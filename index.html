<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <!-- Bootstrap cdn  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- for icon  -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- jsvector styles cdn  -->
    <link
      href="
https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.css
"
      rel="stylesheet"
    />

    <!-- custom css  -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Admin Panel Layout  -->
    <div class="dashboard d-flex">
      <!-- dashboard sidebar  -->
      <div class="sidebar">
        <!-- profile  -->
        <div class="d-flex align-items-center gap-2 py-2">
          <img
            class="avater rounded-circle"
            src="./assets/profile/profile.jpg"
            alt="profile image"
          />
          <h6 class="m-0">Al Hasan Nirob</h6>
        </div>
        <hr />

        <!-- navbar links  -->
        <div class="d-flex flex-column gap-1">
          <!-- Search Field -->
          <div class="input-group search-field">
            <input
              type="text"
              class="form-control"
              placeholder="Search..."
              aria-label="Search"
            />

            <button class="btn search-btn" type="button" aria-label="Search">
              <i class="bi bi-search"></i>
            </button>
          </div>

          <!-- Sidebar Navigation -->
          <div class="sidebar-menu mt-3">
            <!-- Dashboard Toggle -->
            <a
              class="sidebar-link d-flex align-items-center justify-content-between active"
              data-bs-toggle="collapse"
              href="#dashboardSubmenu"
              role="button"
              aria-expanded="false"
              aria-controls="dashboardSubmenu"
            >
              <span>
                <i class="bi bi-speedometer2 me-2"></i>
                Dashboard
              </span>

              <i class="bi bi-chevron-right menu-arrow"></i>
            </a>

            <!-- Dashboard Submenu -->
            <div class="collapse" id="dashboardSubmenu">
              <ul class="submenu">
                <li>
                  <a href="#">Dashboard v1</a>
                </li>
                <li>
                  <a href="#">Dashboard v2</a>
                </li>
                <li>
                  <a href="#">Dashboard v3</a>
                </li>
              </ul>
            </div>
          </div>

          <a class="sidebar-link" href="#" role="button">
            <span> <i class="bi bi-grid me-2"></i> Widgets </span>
          </a>
        </div>
      </div>

      <div class="dashboard-main">
        <!-- Dashboard Topbar -->
        <div class="topbar">
          <nav class="navbar sticky-top bg-white border-bottom">
            <div class="container-fluid">
              <!-- Left Side -->
              <div class="d-flex align-items-center gap-3">
                <!-- Sidebar Toggle -->
                <button class="btn" type="button" id="sidebarToggle">
                  <i class="bi bi-list fs-4"></i>
                </button>

                <a href="#" class="nav-link"> Home </a>

                <a href="#" class="nav-link">Contact</a>
              </div>

              <!-- Right Side -->
              <div class="d-flex align-items-center gap-2">
                <!-- Search -->
                <form class="d-none" id="navbarSearch" role="search">
                  <input
                    class="form-control form-control-sm"
                    type="search"
                    placeholder="Search..."
                    aria-label="Search"
                  />
                </form>

                <button
                  class="btn"
                  type="button"
                  id="searchToggle"
                  aria-label="Toggle search"
                >
                  <i class="bi bi-search fs-5"></i>
                </button>

                <!-- Messages -->
                <button
                  class="btn position-relative"
                  type="button"
                  aria-label="Messages"
                >
                  <i class="bi bi-chat-dots fs-5"></i>
                  <span
                    class="position-absolute top-0 start-70 translate-middle badge rounded-pill bg-success"
                  >
                    3
                  </span>
                </button>

                <!-- Notifications -->
                <button
                  class="btn position-relative"
                  type="button"
                  aria-label="Notifications"
                >
                  <i class="bi bi-bell fs-5"></i>
                  <span
                    class="position-absolute top-0 start-70 translate-middle badge rounded-pill bg-danger"
                  >
                    5
                  </span>
                </button>

                <!-- Profile -->
                <button class="btn" type="button" aria-label="Profile">
                  <i class="bi bi-person-circle fs-5"></i>
                </button>
              </div>
            </div>
          </nav>
        </div>

        <div class="content">
          <div class="container-fluid">
            <!-- Section Title -->
            <div
              class="d-flex flex-wrap align-items-center justify-content-between gap-3"
            >
              <h2 class="mb-0">Dashboard</h2>

              <nav aria-label="breadcrumb">
                <ol class="breadcrumb m-0">
                  <li class="breadcrumb-item"><a href="#">Home</a></li>
                  <li class="breadcrumb-item active" aria-current="page">
                    Dashboard V1
                  </li>
                </ol>
              </nav>
            </div>
            <!-- Section Title End  -->

            <!-- Statistics card start  -->
            <div class="row my-3 g-3">
              <!-- New Orders -->
              <div class="col-12 col-sm-6 col-xl-3">
                <!-- stats card  -->
                <div
                  class="small-box bg-primary rounded text-white overflow-hidden"
                >
                  <div class="d-flex justify-content-between p-3">
                    <div>
                      <h2 class="mb-2">150</h2>
                      <p class="mb-0">New Orders</p>
                    </div>

                    <div class="small-box-icon">
                      <i class="bi bi-bag-check"></i>
                    </div>
                  </div>

                  <a href="#" class="small-box-footer">
                    More info <i class="bi bi-arrow-right-circle"></i>
                  </a>
                </div>
              </div>

              <!-- stats card  -->
              <div class="col-12 col-sm-6 col-xl-3">
                <div
                  class="small-box bg-success rounded text-white overflow-hidden"
                >
                  <div class="d-flex justify-content-between p-3">
                    <div>
                      <h2 class="mb-2">53%</h2>
                      <p class="mb-0">Bounce Rate</p>
                    </div>

                    <div class="small-box-icon">
                      <i class="bi bi-bar-chart-line"></i>
                    </div>
                  </div>

                  <a href="#" class="small-box-footer">
                    More info <i class="bi bi-arrow-right-circle"></i>
                  </a>
                </div>
              </div>
              <!-- stats card  -->
              <div class="col-12 col-sm-6 col-xl-3">
                <div
                  class="small-box bg-warning rounded text-white overflow-hidden"
                >
                  <div class="d-flex justify-content-between p-3">
                    <div>
                      <h2 class="mb-2">44</h2>
                      <p class="mb-0">User Registrations</p>
                    </div>

                    <div class="small-box-icon">
                      <i class="bi bi-person-plus"></i>
                    </div>
                  </div>

                  <a href="#" class="small-box-footer">
                    More info <i class="bi bi-arrow-right-circle"></i>
                  </a>
                </div>
              </div>

              <!-- stats card  -->
              <div class="col-12 col-sm-6 col-xl-3">
                <div
                  class="small-box bg-danger rounded text-white overflow-hidden"
                >
                  <div class="d-flex justify-content-between p-3">
                    <div>
                      <h2 class="mb-2">65</h2>
                      <p class="mb-0">Unique Visitors</p>
                    </div>

                    <div class="small-box-icon">
                      <i class="bi bi-pie-chart"></i>
                    </div>
                  </div>

                  <a href="#" class="small-box-footer">
                    More info <i class="bi bi-arrow-right-circle"></i>
                  </a>
                </div>
              </div>
            </div>
            <!-- Statistics card end  -->

            <!-- Sales Overview Chart Starts Here -->
            <div class="row g-3">
              <div class="col-12 col-sm-6 col-xl-7">
                <!-- Chart Tab  -->
                <div class="border rounded">
                  <!-- Section Header -->
                  <div
                    class="border-bottom p-2 d-flex justify-content-between align-items-center"
                  >
                    <h5 class="mb-0">
                      <i class="bi bi-graph-up-arrow me-2"></i> Sales
                    </h5>

                    <ul class="nav nav-pills">
                      <li class="nav-item">
                        <button
                          class="nav-link active"
                          data-bs-toggle="tab"
                          data-bs-target="#area-chart"
                          type="button"
                        >
                          Area
                        </button>
                      </li>
                      <li class="nav-item">
                        <button
                          class="nav-link"
                          data-bs-toggle="tab"
                          data-bs-target="#donut-chart"
                          type="button"
                        >
                          Donut
                        </button>
                      </li>
                    </ul>
                  </div>

                  <div class="tab-content p-3">
                    <div class="tab-pane fade show active" id="area-chart">
                      <canvas id="salesAreaChart"></canvas>
                    </div>

                    <div class="tab-pane fade" id="donut-chart">
                      <canvas id="salesDonutChart"></canvas>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12 col-sm-6 col-xl-5">
                <div class="card h-100">
                  <div class="card-header d-flex align-items-center gap-2">
                    <i class="bi bi-globe-americas"></i>
                    <h6 class="mb-0">Visitors</h6>
                  </div>

                  <div class="card-body">
                    <div id="visitors-map" style="height: 350px"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap CDN  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Jsvectormap cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/maps/world-merc.js"></script>
    <!-- chart.js cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="./js/index.js"></script>
  </body>
</html>
